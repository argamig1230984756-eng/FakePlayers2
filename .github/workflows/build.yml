name: Build plugins

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0.0
      - name: Build Paper
        working-directory: paper
        run: gradle build --no-daemon
      - name: Build Velocity
        working-directory: velocity
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FakePlayers-jars
          path: |
            paper/build/libs/FakePlayers-Paper.jar
            velocity/build/libs/FakePlayers-Velocity.jar
